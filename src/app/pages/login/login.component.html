<div class="content-container">
<form>
    <label for="email">Login</label><br>
    <input class="input-simples" id="email" name="email" [(ngModel)]="login" type="email" placeholder="Digite seu email" (keyup)="validarFormulario()" />

    <label for="input-senha">Senha</label><br>
    <input class="input-simples" id="input-senha" name="input-senha" [(ngModel)]="senha" type="password" placeholder="Digite sua senha" (keyup)="validarFormulario()" />

    <button class="input-submeter" (click)="fazerLogin()"  [disabled]="botaoDesabilitado">
        Confirmar
    </button>
</form>
</div>
